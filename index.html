<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bubble Sort Visualisierung</title>

<style>
    body {
        background: #0b0f14;
        color: #e5e7eb;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
    }

    #array {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 300px;
        margin: 40px auto;
        width: 80%;
    }

    .bar {
        width: 20px;
        margin: 2px;
        background: #9ca3af; /* grau */
        transition: height 0.3s, background 0.3s;
    }

    .compare {
        background: #ef4444; /* rot */
    }

    .sorted {
        background: #22c55e; /* grün */
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #111827;
        color: white;
        border: 1px solid #374151;
    }
</style>
</head>

<body>

<h1>Bubble Sort – Visualisierung</h1>
<p>Zeit: O(n²) | Speicher: O(1)</p>

<div id="array"></div>

<button onclick="bubbleSort()">Start Bubble Sort</button>

<script>
    const arrayContainer = document.getElementById("array");
    let values = [];

    // Array erzeugen
    function generateArray(size = 20) {
        values = [];
        arrayContainer.innerHTML = "";

        for (let i = 0; i < size; i++) {
            const value = Math.floor(Math.random() * 200) + 20;
            values.push(value);

            const bar = document.createElement("div");
            bar.classList.add("bar");
            bar.style.height = value + "px";
            arrayContainer.appendChild(bar);
        }
    }

    // Pause für Animation
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function bubbleSort() {
        const bars = document.getElementsByClassName("bar");

        for (let i = 0; i < values.length; i++) {

            for (let j = 0; j < values.length - i - 1; j++) {

                bars[j].classList.add("compare");
                bars[j + 1].classList.add("compare");

                await sleep(200);

                if (values[j] > values[j + 1]) {
                    // Tauschen
                    [values[j], values[j + 1]] = [values[j + 1], values[j]];

                    bars[j].style.height = values[j] + "px";
                    bars[j + 1].style.height = values[j + 1] + "px";
                }

                bars[j].classList.remove("compare");
                bars[j + 1].classList.remove("compare");
            }

            bars[values.length - i - 1].classList.add("sorted");
        }
    }

    generateArray();
</script>

</body>
</html>
